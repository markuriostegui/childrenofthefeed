name: Publish Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow pypdf reportlab

      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.2"

      - name: Install native PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libpng-dev \
            libgraphite2-dev \
            libharfbuzz-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            fonts-noto-core \
            fonts-noto-cjk

      - name: Install Tectonic
        uses: taiki-e/install-action@v2
        with:
          tool: tectonic

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node -e "require('playwright')"

      - name: Install Typst
        env:
          TYPST_VERSION: "0.15.0"
        run: |
          curl -L "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
          mkdir -p /tmp/typst
          tar -xJf /tmp/typst.tar.xz -C /tmp/typst --strip-components=1
          chmod +x /tmp/typst/typst
          sudo mv /tmp/typst/typst /usr/local/bin/typst
          typst --version

      - name: Build publication package
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/research_cli
          NODE_PATH: ${{ github.workspace }}/node_modules
          CHILDREN_FEED_BUILD_SPANISH_PDF: "1"
        run: |
          python -m research_cli.cli build-index --root ${{ github.workspace }}
          python -m research_cli.cli seed-papers --root ${{ github.workspace }} --overwrite
          python -m research_cli.cli build-master-paper --root ${{ github.workspace }}
          python -m research_cli.cli export-papers --root ${{ github.workspace }}
          python -m research_cli.cli seed-book --root ${{ github.workspace }} --overwrite
          python -m research_cli.cli export-book --root ${{ github.workspace }}
          python -m research_cli.cli export-book-print --root ${{ github.workspace }}
          python -m research_cli.cli review-book-print --root ${{ github.workspace }}
          python -m research_cli.cli build-site --root ${{ github.workspace }}
          python -m research_cli.cli review-publication --root ${{ github.workspace }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
